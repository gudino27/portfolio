# Scanner trap — slices of the per-request ID feed the decoy pages, so every
# response has fresh fake values and links that lead deeper into the maze.
map $request_id $maze_a { "~^(?<p>.{8})"         $p; }
map $request_id $maze_b { "~^.{8}(?<p>.{8})"     $p; }
map $request_id $maze_c { "~^.{16}(?<p>.{8})"    $p; }
map $request_id $maze_d { "~^.{24}(?<p>.{8})"    $p; }

# Caps how many trap connections can be held open at once.
limit_conn_zone $binary_remote_addr zone=trap:1m;

log_format trap 'TRAP $remote_addr cf=$http_cf_connecting_ip [$time_local] '
                '"$request" $status "$http_user_agent"';

server {
    listen 80;
    server_name _;
    server_tokens off;

    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;

    # HTML document — no-cache so the browser always re-validates,
    # full security header set here since CSP/X-Frame-Options only
    # matter on document responses.
    location = /index.html {
        add_header Cache-Control "no-cache" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self' https://static.cloudflareinsights.com; style-src 'self' 'unsafe-inline'; img-src 'self' data: https://cdn.jsdelivr.net; font-src 'self'; connect-src 'self' https://cloudflareinsights.com https://api.web3forms.com https://api.github.com https://gudinocustom.com https://virtual-counselor.org https://gudino27.github.io; frame-src 'none'; object-src 'none'; base-uri 'self'; worker-src 'none';" always;
    }

    # SPA catch-all — also serves index.html for client-side routes.
    # try_files serves the file in this location context (no re-eval),
    # so the full header set must be repeated here.
    location / {
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self' https://static.cloudflareinsights.com; style-src 'self' 'unsafe-inline'; img-src 'self' data: https://cdn.jsdelivr.net; font-src 'self'; connect-src 'self' https://cloudflareinsights.com https://api.web3forms.com https://api.github.com https://gudinocustom.com https://virtual-counselor.org https://gudino27.github.io; frame-src 'none'; object-src 'none'; base-uri 'self'; worker-src 'none';" always;
        try_files $uri $uri/ /index.html;
    }

    # Resume — lives only on the server (gitignored). Skips the page CSP
    # so the browser's PDF viewer isn't restricted, re-validates so a
    # replaced file shows up immediately, and stays out of search results.
    # No try_files here, so a missing file returns 404 instead of index.html.
    location = /resume.pdf {
        add_header X-Content-Type-Options "nosniff" always;
        add_header Cache-Control "no-cache" always;
        add_header X-Robots-Tag "noindex" always;
    }

    # Scanner trap — probes for secrets/config files used to fall through to
    # the SPA catch-all and get a 200 with index.html. Now credential-style
    # paths get a fake .env and everything else an endless fake directory
    # listing, both trickled out slowly. Must stay above the static-asset
    # regex so paths like /config.js land here.
    location ~* (^|/)(\.env|\.git|\.aws|\.ssh|\.svn|\.backup|\.htpasswd|\.DS_Store|wp-config|wp-admin|wp-login|wp-includes|wp-content|xmlrpc\.php|phpinfo|config\.(php|ya?ml|json|js|bak|old)|credentials|secrets?\.|id_(rsa|dsa|ecdsa|ed25519)|docker-compose|[^/]+\.(pem|key|sql|bak)$) {
        root /usr/share/nginx/trap;
        access_log /dev/stdout trap;
        gzip off;
        ssi on;
        ssi_types text/plain;
        limit_rate 32;
        limit_conn trap 20;
        limit_conn_status 444;
        add_header X-Robots-Tag "noindex, nofollow" always;
        add_header Cache-Control "no-store" always;

        if ($uri ~* (\.env|credentials|secrets?\.|\.pem$|\.key$|id_(rsa|dsa|ecdsa|ed25519))) {
            rewrite ^ /env.txt break;
        }
        rewrite ^ /maze.html break;
    }

    # Fonts — explicit Content-Type for woff2 + long-lived cache.
    location ~* \.woff2$ {
        add_header Content-Type "font/woff2" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Cache-Control "public, immutable" always;
        expires 1y;
    }

    # Hashed static assets — immutable 1-year cache.
    location ~* \.(js|css|png|jpg|jpeg|gif|svg|ico|woff|ttf|eot)$ {
        add_header X-Content-Type-Options "nosniff" always;
        add_header Cache-Control "public, immutable" always;
        expires 1y;
    }
}
